<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9E5D8" />

    <!-- Google Search Console ownership. Google re-checks this
         periodically, so it has to stay here permanently — removing it
         un-verifies the property. -->
    <!-- prettier-ignore -->
    <meta name="google-site-verification" content="QhVzDrci0Q7aIHGlhUUzlUMGchaWy0UIm_JAwDLUC_M" />

    <title>Fernando Zepeda</title>
    <meta
      name="description"
      content="Fernando Zepeda — engineer, philosopher, traveler, storyteller. A look into what I build, write, and think about."
    />
    <!-- One address for the site. Everything else redirects here, so a
         search engine never has to guess which copy is the real one. -->
    <link rel="canonical" href="https://www.fernandozepeda.me/" />

    <meta property="og:site_name" content="Fernando Zepeda" />
    <meta property="og:title" content="Fernando Zepeda" />
    <meta
      property="og:description"
      content="Engineer, philosopher, traveler, storyteller. A look into what I build, write, and think about."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fernandozepeda.me/" />
    <!-- Absolute, and 1200×630: relative paths break every link preview,
         and the wrong aspect ratio gets cropped by each network differently. -->
    <meta property="og:image" content="https://www.fernandozepeda.me/images/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fernando Zepeda" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fernando Zepeda" />
    <meta
      name="twitter:description"
      content="Engineer, philosopher, traveler, storyteller. A look into what I build, write, and think about."
    />
    <meta name="twitter:image" content="https://www.fernandozepeda.me/images/og-card.jpg" />

    <link rel="preload" as="image" href="/images/hero-art.jpg" fetchpriority="low" />

    <!-- Person schema. sameAs is the part that matters for a name search:
         it tells Google this site and these profiles are one person, which
         is what makes them cluster in the results instead of competing. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Fernando Zepeda",
        "url": "https://www.fernandozepeda.me/",
        "image": "https://www.fernandozepeda.me/images/og-card.jpg",
        "description": "Mechanical engineering student at UC San Diego writing about engineering, business and philosophy.",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "University of California, San Diego",
          "url": "https://www.ucsd.edu/"
        },
        "sameAs": [
          "https://www.linkedin.com/in/fernando-zepeda-/",
          "https://substack.com/@fernandozepeda",
          "https://www.instagram.com/fernandozepedq/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

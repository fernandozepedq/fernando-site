<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- F.Z. in Instrument Sans 700, the face the site already uses for
     structure. Prata sets the display type but its thin strokes
     disappear below about 24px, which is most of a favicon's life.
     Moss ground because a coloured tile holds its own against both
     dark and light tab strips, where an ink one goes invisible.
     Outlines, not text, so it never depends on a font being there. -->
